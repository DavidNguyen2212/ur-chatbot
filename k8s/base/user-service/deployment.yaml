apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata: 
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:local-v1
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 4000
          - containerPort: 50051
        envFrom:
          - configMapRef:
              name: user-service-configs
          - secretRef:
              name: user-service-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 30