apiVersion: apps/v1 # kubectl wait --for=condition=ready pod -l app=kafka --timeout=180s
kind: Deployment
metadata:
  name: kafdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop
          ports:
            - containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: 'kafka:9092'
---
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
spec:
  type: NodePort   # To access from browser through minikube service
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30090
  selector:
    app: kafdrop
