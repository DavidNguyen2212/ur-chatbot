services:
  user-service:
    build: .
    container_name: user-service
    ports:
      - "4000:4000"   # REST API
      - "50051:50051" # gRPC
    networks:
      - user_service
    environment:
      NODE_ENV: development
      PORT: 4000
      GRPC_PORT: 50051
      # Kafka, Redis URL, DB... để sau sẽ trỏ tới Kubernetes Service
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      # nếu local vẫn có kafka (docker-compose khác), thì để ở đây
      # - kafka
      []

networks:
  user_service:
    driver: bridge

